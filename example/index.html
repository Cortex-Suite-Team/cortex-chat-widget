<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cortex Chat Widget Examples</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background:
          radial-gradient(circle at top left, rgba(14, 165, 233, 0.14), transparent 34%),
          linear-gradient(180deg, #f8fbff 0%, #eef4f8 100%);
        color: #163045;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      main {
        width: min(100%, 720px);
        padding: 28px;
        border: 1px solid rgba(148, 163, 184, 0.28);
        border-radius: 22px;
        background: rgba(255, 255, 255, 0.9);
        box-shadow: 0 20px 48px rgba(15, 23, 42, 0.09);
      }

      .eyebrow {
        display: inline-block;
        padding: 6px 10px;
        border-radius: 999px;
        background: rgba(14, 165, 233, 0.12);
        color: #0369a1;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      h1 {
        margin: 14px 0 10px;
        font-size: clamp(2rem, 5vw, 3rem);
        line-height: 1.05;
      }

      p {
        margin: 0;
        color: #587084;
        line-height: 1.6;
      }

      nav {
        display: grid;
        gap: 12px;
        margin-top: 24px;
      }

      a {
        display: block;
        padding: 16px 18px;
        border: 1px solid rgba(148, 163, 184, 0.28);
        border-radius: 16px;
        background: #ffffff;
        color: #075985;
        text-decoration: none;
        font-weight: 700;
      }

      a span {
        display: block;
        margin-top: 4px;
        color: #64748b;
        font-size: 0.92rem;
        font-weight: 400;
      }
    </style>
  </head>
  <body>
    <main>
      <span class="eyebrow">Runtime Examples</span>
      <h1>Cortex Chat Widget</h1>
      <p>
        Use these pages to smoke-test the built widget bundle against the live Control Plane flow.
      </p>

      <nav aria-label="Cortex Chat Widget examples">
        <a href="./real-runtime.html">
          Chat only
          <span>Rail + chat shell. No historyTarget is passed.</span>
        </a>
        <a href="./real-runtime-history.html">
          Chat with integrated history
          <span>History is rendered inside the widget shell after system::opened.</span>
        </a>
      </nav>
    </main>
  </body>
</html>
