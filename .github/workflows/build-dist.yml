name: Build dist

on:
  workflow_dispatch:

concurrency:
  group: build-dist-main
  cancel-in-progress: false

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-dist:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout chat widget
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          path: cortex-chat-widget

      - name: Reset chat widget to latest origin/main
        working-directory: cortex-chat-widget
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main

      - name: Checkout sdk-ui
        uses: actions/checkout@v4
        with:
          repository: Cortex-Suite-Team/cortex-sdk-ui
          path: sdk-ui

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build sdk-ui
        working-directory: sdk-ui
        run: |
          npm install
          npm run typecheck
          npm test
          npm run build

      - name: Install dependencies
        working-directory: cortex-chat-widget
        run: npm ci

      - name: Sync SDK to latest
        working-directory: cortex-chat-widget
        run: npm run sync:sdk

      - name: Typecheck
        working-directory: cortex-chat-widget
        run: npm run typecheck

      - name: Test
        working-directory: cortex-chat-widget
        run: npm test

      - name: Build dist
        working-directory: cortex-chat-widget
        run: npm run build

      - name: Commit built dist
        working-directory: cortex-chat-widget
        run: |
          LAST_MESSAGE="$(git log -1 --pretty=%B)"

          if echo "$LAST_MESSAGE" | grep -q "\[skip ci\]"; then
            echo "Current commit is marked [skip ci]; skipping dist commit."
            exit 0
          fi

          git add -f dist

          if git diff --cached --quiet; then
            echo "dist is up to date"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: build dist [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
