name: Build dist

on:
  workflow_dispatch:

concurrency:
  group: build-dist-main
  cancel-in-progress: false

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-dist:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout chat widget
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          path: cortex-chat-widget

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: cortex-chat-widget/package-lock.json

      - name: Install published dependencies
        working-directory: cortex-chat-widget
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Typecheck
        working-directory: cortex-chat-widget
        run: npm run typecheck

      - name: Test
        working-directory: cortex-chat-widget
        run: npm test

      - name: Verify reproducible dist and package
        working-directory: cortex-chat-widget
        run: |
          npm run check:reproducible
          npm run check:isolated-package

      - name: Commit built dist
        working-directory: cortex-chat-widget
        run: |
          LAST_MESSAGE="$(git log -1 --pretty=%B)"

          if echo "$LAST_MESSAGE" | grep -q "\[skip ci\]"; then
            echo "Current commit is marked [skip ci]; skipping dist commit."
            exit 0
          fi

          git add -f dist

          if git diff --cached --quiet; then
            echo "dist is up to date"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: build dist [skip ci]"
            git push origin HEAD:main
          fi
