name: Build dist

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-dist:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout chat widget
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          path: cortex-chat-widget

      - name: Checkout sdk-ui
        uses: actions/checkout@v4
        with:
          repository: Cortex-Suite-Team/cortex-sdk-ui
          path: cortex-sdk-ui

      - name: Checkout sdk
        uses: actions/checkout@v4
        with:
          repository: Cortex-Suite-Team/cortex-sdk
          path: cortex-sdk

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build SDK
        working-directory: cortex-sdk/js
        run: |
          npm install
          npm run build

      - name: Build SDK UI
        working-directory: cortex-sdk-ui
        run: |
          npm install
          npm run typecheck
          npm test
          npm run build

      - name: Install chat-widget dependencies from local packages
        working-directory: cortex-chat-widget
        run: |
          npm pkg set dependencies."@cortex-suite/sdk"="file:../cortex-sdk/js"
          npm pkg set dependencies."@cortex-suite/sdk-ui"="file:../cortex-sdk-ui"
          npm install

      - name: Typecheck chat widget
        working-directory: cortex-chat-widget
        run: npm run typecheck

      - name: Test chat widget
        working-directory: cortex-chat-widget
        run: npm test

      - name: Build chat widget dist
        working-directory: cortex-chat-widget
        run: npm run build

      - name: Restore publishable package.json
        working-directory: cortex-chat-widget
        run: |
          git checkout -- package.json
          rm -f package-lock.json

      - name: Commit built dist
        working-directory: cortex-chat-widget
        run: |
          if [ -n "$(git status --porcelain dist)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add dist
            git commit -m "chore: build dist [skip ci]"
            git push
          else
            echo "dist is up to date"
          fi
